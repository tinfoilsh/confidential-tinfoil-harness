# Measures the CVM described by tinfoil-config.yml and publishes the release
# clients verify against: tinfoil.hash plus a Sigstore bundle signed by this
# workflow's GitHub identity. Nothing here builds the harness -- the container
# digest in the config is what pins the code.
name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: tinfoilsh/measure-image-action@ca4cfa35773897455c9e51409d61c75b8e377c27 # v0.10.2
        with:
          config-file: ${{ github.workspace }}/tinfoil-config.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Clients resolve this deployment through /releases/latest, so the
          # release has to be the latest one.
          mark-as-latest: true
