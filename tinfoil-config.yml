# Measured workload definition: what tinfoild launches, and the only thing a
# client's attestation of this enclave says it is running.
cvm-version: 0.11.0

cpus: 2
memory: 4096

# The shim terminates TLS on 443 and is the only way in. It requires a Tinfoil
# API key, which is the same key the harness then forwards upstream.
shim:
  upstream-port: 8081
  authenticated: true
  paths:
    - /agui
    - /healthz

networks:
  # Everything here is a host the harness attests or a service it needs to
  # attest one. An unresolvable entry fails the whole set closed.
  upstream:
    egress: allowlist
    allow:
      # The gateway, and one host per tool family in tools.go. Keep the env
      # block below in step.
      - inference-gateway.tinfoil.sh
      - websearch.tinfoil.sh
      # The one host the harness does not attest. A detached run spills its
      # log there, sealed under a caller key that never leaves the enclave.
      - api.tinfoil.sh
      # Attestation of every host in main.go, fetched from the host itself,
      # including any replica the gateway names in a 422.
      - kimi-k3-inf14.tinfoil.containers.tinfoil.dev
      - deepseek-v4-flash-inf15.tinfoil.containers.tinfoil.dev
      - gemma4-31b-inf6-0.tinfoil.containers.tinfoil.dev
      - gpt-oss-120b-inf6-0.tinfoil.containers.tinfoil.dev
      - llama3-3-70b-inf12.tinfoil.containers.tinfoil.dev
      - llama3-3-70b-inf13.tinfoil.containers.tinfoil.dev
      - llama3-3-70b.inf13.tinfoil.sh
      # Verifying those attestations: the pinned repo's release and Sigstore
      # bundle, the Sigstore trust root, and the AMD/Intel collateral proxies.
      - github-proxy.tinfoil.sh
      - tuf-repo-cdn.sigstore.dev
      - kds-proxy.tinfoil.sh
      - tdx-proxy.tinfoil.sh

containers:
  - name: harness
    image: "ghcr.io/tinfoilsh/confidential-tinfoil-harness@sha256:c11c8c22a77fead04cd7504aa6e1fa107b5078667df6167742ae090ae9f69470" # v0.1.5
    networks: [upstream]
    # TLS to the gateway: EHBP seals the body, not the header carrying the key.
    env:
      - TINFOIL_GATEWAY_URL: https://inference-gateway.tinfoil.sh
      - TINFOIL_TOOLS_ENCLAVE: websearch.tinfoil.sh
      - TINFOIL_CONTROLPLANE_URL: https://api.tinfoil.sh
    # A run's log lives in memory only, so nothing needs to survive a restart.
    read_only: true
    tmpfs:
      /tmp: rw,noexec,nosuid,nodev,size=16m
    # A harness that pinned no model enclave exits; restarting is how it waits
    # for one. A tool enclave that did not verify is skipped, not fatal.
    restart: always
